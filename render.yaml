# Despliegue en la nube con capa gratuita (Render): servicio web Node.
# Render solo permite UNA base PostgreSQL gratuita por cuenta; Nova usa un schema propio ("nova") dentro de la que ya existe,
# así no toca las tablas de otros proyectos. Pega su "Internal Database URL" en DATABASE_URL cuando Render la pida.
# Conecta el repositorio en https://dashboard.render.com → New → Blueprint.
services:
  - type: web
    name: nova-ruta-segura
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # se pide al crear el servicio (Internal Database URL de tu base PostgreSQL)
      - key: DB_SCHEMA
        value: nova
      - key: DEMO_PASSWORD   # clave secreta de sofia@demo.co y moderadora@demo.co (la ves en Environment)
        generateValue: true
      - key: SEED_DEMO
        value: "1"          # pon "0" cuando haya datos reales
      - key: APP_USER_AGENT
        value: "NovaRutaSegura/1.0 (tu-correo@ejemplo.com)"
