# Despliegue en la nube con capa gratuita (Render): servicio web Node + base PostgreSQL.
# Conecta el repositorio en https://dashboard.render.com → New → Blueprint.
services:
  - type: web
    name: luma-ruta-segura
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: luma-db, property: connectionString }
      - key: SEED_DEMO
        value: "1"          # pon "0" cuando haya datos reales
      - key: APP_USER_AGENT
        value: "LumaRutaSegura/1.0 (tu-correo@ejemplo.com)"

databases:
  - name: luma-db
    plan: free
    databaseName: luma
    user: luma
