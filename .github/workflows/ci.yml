name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      # Auditoría de dependencias (OWASP A06: componentes vulnerables)
      - run: npm audit --omit=dev --audit-level=high
